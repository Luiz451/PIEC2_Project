server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: fazenda-digital

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fazenda_digital}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:adminpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration