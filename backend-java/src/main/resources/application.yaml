spring:
  application:
    name: fazenda-digital-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fazenda_digital}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:adminpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
