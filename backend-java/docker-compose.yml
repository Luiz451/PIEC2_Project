version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: fazenda_digital_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: fazenda_digital
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: